services:
  postgres:
    image: postgres:17-alpine
    container_name: labmedis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labmedis
      POSTGRES_USER: labmedis
      # Lu depuis .env sur prod (le volume postgres y a été init avec un
      # password différent de labmedis_dev_password). Fallback = valeur dev.
      # Postgres n'écrase pas le password au démarrage suivant : la valeur ici
      # n'est utilisée QU'à l'init du volume, mais rester cohérent évite les
      # confusions.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labmedis_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labmedis -d labmedis"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - labmedis-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labmedis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # cf. commentaire postgres : password lu depuis .env sur prod.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=labmedis;Username=labmedis;Password=${POSTGRES_PASSWORD:-labmedis_dev_password}"
      UploadPath: /app/uploads
      UploadBaseUrl: /uploads
    ports:
      - "8082:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - labmedis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labmedis-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_TARGET: http://api:8080
    ports:
      - "5173:80"
    networks:
      - labmedis-net

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    container_name: labmedis-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Password lu depuis .env sur prod (le volume postgres y a été init avec un
      # password différent de labmedis_dev_password). Fallback = valeur dev locale.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=labmedis;Username=labmedis;Password=${POSTGRES_PASSWORD:-labmedis_dev_password}"
    ports:
      - "8083:8080"
    networks:
      - labmedis-net

  telegram-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: labmedis-telegram-bot
    restart: unless-stopped
    depends_on:
      - mcp
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MCP_URL: http://mcp:8080/
      ALLOWED_TELEGRAM_CHAT_IDS: ${ALLOWED_TELEGRAM_CHAT_IDS:-}
    networks:
      - labmedis-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: labmedis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@labmedis.tg
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - labmedis-net

volumes:
  postgres_data:
  uploads_data:

networks:
  labmedis-net:
    driver: bridge
